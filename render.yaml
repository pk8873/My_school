# Render Blueprint: https://render.com/docs/blueprint-spec
# Demo/testing setup. Review Render's current free database limits before using real student data.
services:
  - type: web
    name: school-saathi
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: school-saathi-db
          property: connectionString

databases:
  - name: school-saathi-db
    databaseName: school_saathi
    user: school_saathi
    plan: free
    region: singapore

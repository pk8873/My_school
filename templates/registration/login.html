{% extends "base.html" %}{% block title %}Login · School Saathi{% endblock %}{% block content %}<div class="row justify-content-center mt-4"><div class="col-12 col-sm-9 col-md-6 col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-1">Welcome back</h1><p class="text-secondary">Sign in to your School Saathi account.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="mb-3"><label class="form-label" for="{{ form.username.id_for_label }}">Username</label>{{ form.username }}</div><div class="mb-3"><label class="form-label" for="{{ form.password.id_for_label }}">Password</label>{{ form.password }}</div><input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary w-100" type="submit">Sign in</button></form></div></div></div></div><script>document.querySelectorAll('input').forEach(el=>{if(el.type!=='hidden')el.classList.add('form-control')})</script>{% endblock %}
